    <style>
        * {

<body>

<div class="container">

    <h2>Run Outreach Pipeline</h2>

    <!-- Keywords -->
    <div class="form-group">

        <label>Keywords</label>

        <div id="keywords-container">

            <!-- First keyword -->
            <div class="keyword-row">
                <input
                    type="text"
                    class="keyword-input"
                    placeholder="Enter keyword e.g. Python"
                >

                <button
                    type="button"
                    class="add-keyword-btn"
                    onclick="addKeyword()"
                >
                    +
                </button>
            </div>

        </div>

        <div class="hint">
            Add multiple keywords. They will be combined using AND.
        </div>

    </div>


    <!-- InMail Message -->
    <div class="form-group">

        <label for="inmail_message">
            InMail Message
        </label>

        <textarea
            id="inmail_message"
            placeholder="Enter your InMail message..."
        ></textarea>

    </div>


    <!-- Connection Message -->
    <div class="form-group">

        <label for="connection_message">
            Connection Message
        </label>

        <textarea
            id="connection_message"
            placeholder="Enter your connection message..."
        ></textarea>

    </div>


    <!-- Run Pipeline -->
    <button
        type="button"
        class="run-btn"
        id="runPipelineBtn"
        onclick="runPipeline()"
    >
        Run Pipeline
    </button>


    <div id="response"></div>

</div>


<script>

    // Add a new keyword input
    function addKeyword() {

        const container = document.getElementById("keywords-container");

        const row = document.createElement("div");
        row.className = "keyword-row";

        row.innerHTML = `
            <input
                type="text"
                class="keyword-input"
                placeholder="Enter keyword e.g. Java"
            >

            <button
                type="button"
                class="remove-keyword-btn"
                onclick="removeKeyword(this)"
            >
                ×
            </button>
        `;

        container.appendChild(row);
    }


    // Remove keyword input
    function removeKeyword(button) {

        button.parentElement.remove();
    }


    // Run API
    async function runPipeline() {

        const button = document.getElementById("runPipelineBtn");

        // Get all keyword inputs
        const keywordInputs = document.querySelectorAll(".keyword-input");

        const keywords = [];

        keywordInputs.forEach(input => {

            const value = input.value.trim();

            if (value) {
                keywords.push(value);
            }

        });


        // Validate keywords
        if (keywords.length === 0) {
            alert("Please enter at least one keyword.");
            return;
        }


        // Get messages
        const inmailMessage =
            document.getElementById("inmail_message").value.trim();

        const connectionMessage =
            document.getElementById("connection_message").value.trim();


        // Convert:
        // Python + Java
        //
        // into:
        // Python AND Java

        const keywordString = keywords.join(" AND ");


        // API payload
        const payload = {
            keywords: keywordString,
            inmail_message: inmailMessage,
            connection_message: connectionMessage
        };


        console.log("Sending payload:", payload);


        try {

            button.disabled = true;
            button.innerText = "Running...";


            const response = await fetch(
                "http://localhost:8000/search-ppl",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(payload)
                }
            );


            const data = await response.json();


            console.log("API Response:", data);


            // Show response
            const responseBox =
                document.getElementById("response");

            responseBox.style.display = "block";

            responseBox.textContent =
                JSON.stringify(data, null, 2);


        } catch (error) {

            console.error(error);

            alert("Something went wrong while calling the API.");

        } finally {

            button.disabled = false;
            button.innerText = "Run Pipeline";
        }
    }

</script>

</body>
</html>
